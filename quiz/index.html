/* ============================================================
   🌱 IDENTITÉ PERSISTANTE — « le téléphone se souvient »
   Après la 1re inscription, on garde pseudo + code à 4 chiffres dans le stockage
   local du navigateur : la personne est reconnue toute seule à chaque visite,
   sans rien retaper. (Désactivé en simulation pour que tout reparte au propre.)
   ============================================================ */
const LS_MOI = "fj_moi", LS_ATTENTE = "fj_code_attente", LS_JETON = "fj_jeton";
// Sur une borne (appareil partagé) on NE garde JAMAIS la carte : le visiteur
// suivant ne doit pas hériter du compte. La session en cours suffit (variable joueur).
// Les comptes Famiformation se reconnaissent via leur JETON, pas via une carte
// pseudo + code : on n'enregistre donc pas de carte pour eux (code vide).
function sauveMoi(pseudo, code) { if (SIMULATION || estBorne() || !code || (joueur && joueur.jeton)) return; try { localStorage.setItem(LS_MOI, JSON.stringify({ name: pseudo, code })); } catch (e) {} }
function chargeMoi() { if (SIMULATION) return null; try { return JSON.parse(localStorage.getItem(LS_MOI) || "null"); } catch (e) { return null; } }
function oublieMoi() { try { localStorage.removeItem(LS_MOI); } catch (e) {} }
// 🔐 Le jeton de session Famiformation. Même règle que la carte : jamais gardé sur
// une borne (chacun se déconnecte en repartant), gardé sur le téléphone perso.
function sauveJeton(j) { if (SIMULATION || estBorne()) return; try { localStorage.setItem(LS_JETON, j || ""); } catch (e) {} }
function chargeJeton() { if (SIMULATION || estBorne()) return ""; try { return localStorage.getItem(LS_JETON) || ""; } catch (e) { return ""; } }
function oublieJeton() { try { localStorage.removeItem(LS_JETON); } catch (e) {} }
// 🎟️ CODE EN ATTENTE (saisi AVANT d'être connecté) : gardé UNIQUEMENT en mémoire
// vive — plus dans le stockage. Il disparaît donc dès qu'on ferme ou recharge la
// page. Conséquence voulue : un code saisi sans se connecter n'est JAMAIS réclamé
// plus tard (ni par un autre compte, ni par soi après être reparti). Pour créditer
// un code, il faut être connecté au moment où on le valide (même session).
let codeAttenteMem = null;
function metCodeAttente(c) { if (SIMULATION) return; codeAttenteMem = c || null; }
function litCodeAttente() { if (SIMULATION) return ""; return codeAttenteMem || ""; }
function videCodeAttente() { codeAttenteMem = null; try { localStorage.removeItem(LS_ATTENTE); } catch (e) {} }

// 🖥️ Sommes-nous dans le parcours BORNE ? (le flag est posé au clic d'un module.)
// 🖥️ Borne ou téléphone ? UNE SEULE source de vérité : l'URL. /quiz/<ville>/borne
// = borne (on y reste, quoi qu'on fasse) ; /quiz/<ville> (et ses vues) = téléphone.
// Plus de « drapeau mémorisé » : la borne ne quitte jamais son adresse, donc on
// ne peut jamais se retrouver par erreur dans l'interface téléphone.
function estBorne() { return ECRAN === "borne"; }
// Retour « accueil » : dans la borne, on RESTE dans la borne (on ne s'échappe pas
// vers le quiz). Renvoie true si on a bien géré la redirection.
function retourAccueilBorne() { if (estBorne()) { location.href = quizBase() + "borne"; return true; } return false; }
// 🖥️ Autocomplétion des champs : COUPÉE sur la borne (appareil partagé) pour ne
// pas proposer les coordonnées du visiteur précédent ; conservée sur un appareil
// perso (téléphone/ordi), où c'est pratique. Renvoie les attributs à injecter.
function autoComp(valeur) {
  return estBorne() ? 'autocomplete="off" autocorrect="off"' : ('autocomplete="' + valeur + '"');
}

// Un code bonus scanné AVANT d'avoir une carte est mis de côté ; dès qu'on est
// identifié (inscription ou récupération), on le récupère automatiquement.
async function reclamerEnAttente() {
  const c = litCodeAttente();
  if (!c || !joueur) return "";
  const res = await apiCodeClaim(joueur.name, joueur.code, c).catch(() => ({ ok: false }));
  videCodeAttente();
  if (res.ok) {
    joueur.solde = res.solde; joueur.recoltees = res.recoltees; joueur.nbCodes = res.nbCodes;
    return t("🎁 Ton code bonus t'a été crédité : +" + res.gagne + " graines !", "🎁 Je bonuscode is bijgeschreven: +" + res.gagne + " zaadjes!");
  }
  return "";
}

async function refreshBoard() {
  // Les écrans télé/borne gèrent leur propre affichage (la télé recharge le
  // classement toute seule à chaque boucle) : on ne touche pas au rendu ici.
  if (ECRAN !== "user") return;
  board = await apiGetBoard();
  const v = currentView();
  // On ne rafraîchit JAMAIS pendant le mini-jeu : ça remettrait la partie à zéro.
  if (v === "herbes") return;
  if (v === "jardin") { jardin = await apiJardin(); }
  // si on affiche le compte à rebours, le classement ou le jardin, on met à jour
  if (v === "board" || v === "jardin") render();
}
setInterval(refreshBoard, 30000); // auto-refresh

// Cette page ne montre QUE ce que voit un joueur : le compte à rebours avant
// l'ouverture, le quiz pendant, puis le classement et le jardin après avoir
// joué. La gestion se fait sur une page séparée (/quiz/admin).
function currentView() {
  // Récupérer un code ou son compte prime sur tout : si on arrive via un QR de
  // code bonus, on montre l'écran du code, pas le compte à rebours.
  if (userView === "reclamer") return "reclamer";
  if (userView === "retrouver") return "retrouver";
  if (userView === "creation") return "creation";
  if (userView === "inscription") return "inscription";
  // L'espace du compte : gate connexion/création si pas connecté, sinon dashboard.
  if (userView === "espace")    return joueur ? "dashboard" : "espace";
  if (userView === "dashboard") return joueur ? "dashboard" : "espace";
  // Vues qui exigent un compte : sinon on renvoie vers l'espace.
  // Le quiz du classement n'est jouable que pendant l'événement ; le quiz DU JARDIN
  // (rejouable, sans impact classement) reste accessible tant qu'on a un jardin.
  if (userView === "quiz")   return (phaseNow() === "ouvert" || toutOuvert() || (quiz && quiz.jardinMode)) ? "quiz" : (joueur ? "dashboard" : "home");
  if (userView === "jardin") return joueur ? "jardin" : "espace";
  if (userView === "herbes") return joueur ? "herbes" : "espace";
  if (userView === "board")  return "board";   // classement : public
  // Défaut selon la phase : quiz fini → classement, sinon accueil.
  return phaseNow() === "termine" ? "board" : "home";
}

    ? t("Quelque chose se prépare... rendez-vous le 29 juillet à 12h30 !", "Er staat iets op til... afspraak op 29 juli om 12u30!")
    : phase === "ouvert"
      ? t("Le quiz est ouvert ! Joue depuis ton téléphone et grimpe au classement.", "De quiz is open! Speel via je telefoon en klim in de ranking.")
      : t("Le quiz est terminé. Merci à tous les participants ! 🎉", "De quiz is afgelopen. Bedankt aan alle deelnemers! 🎉");

  const top5 = board.slice(0, 5);
  const top5Html = (phase !== "avant" && top5.length)
    ? `<div class="cd-top5"><h3>${t("🌟 Top 5 de la récolte", "🌟 Top 5 van de oogst")}</h3>${top5.map((p, i) =>
        `<div class="cd-top5-row"><span>${medals[i] || (i + 1) + "."} ${esc(nomAff(p))}</span><span>${affG(p.score)} 🌰</span></div>`
      ).join("")}</div>`
    : "";

  app.innerHTML = `
    <div class="cd-wrap">
      <div class="cd-phase">${phaseLabel}</div>
      ${phase !== "termine" ? `
      <div class="cd-digits" id="cd-digits">
        <div class="cd-cell"><div class="cd-num" id="cd-j">--</div><div class="cd-lab">${t("Jours", "Dagen")}</div></div>
        <div class="cd-cell"><div class="cd-num" id="cd-h">--</div><div class="cd-lab">${t("Heures", "Uren")}</div></div>
        <div class="cd-cell"><div class="cd-num" id="cd-m">--</div><div class="cd-lab">${t("Minutes", "Minuten")}</div></div>
        <div class="cd-cell sec"><div class="cd-num" id="cd-s">--</div><div class="cd-lab">${t("Secondes", "Seconden")}</div></div>
      </div>` : ""}
      <div class="cd-sprout" id="cd-sprout">${cdPousse(CONFIG.dateLancement.getTime() - Date.now())}</div>
      <div class="cd-info">${info}</div>
      ${top5Html}
    </div>`;

  clearInterval(tickTimer);
  if (phase !== "termine") {
    const tick = () => {
      const diff = Math.max(0, target.getTime() - Date.now());
      // La graine pousse en fonction du temps restant AVANT LE LANCEMENT :
      // jour après jour, puis fleur à 10 s, puis fruit une fois lancé.
      const sp = document.getElementById("cd-sprout");
      if (sp) sp.textContent = cdPousse(CONFIG.dateLancement.getTime() - Date.now());
      // 📺 Télé, avant le lancement : dès qu'il reste ≤ 10 s, on passe aux gros
      // chiffres seuls (teleFinal enchaîne ensuite confettis puis classement).
      if (ECRAN === "tele" && phase === "avant" && diff <= 10000) {
        clearInterval(tickTimer); teleFinal(); return;
      }
      if (diff === 0) { render(); return; } // bascule de phase (hors télé)
      $("#cd-j").textContent = pad(Math.floor(diff / 86400000));
      $("#cd-h").textContent = pad(Math.floor((diff % 86400000) / 3600000));
      $("#cd-m").textContent = pad(Math.floor((diff % 3600000) / 60000));
      $("#cd-s").textContent = pad(Math.floor((diff % 60000) / 1000));
    };
    tick();
    tickTimer = setInterval(tick, 1000);
  }
}

// 📺 TÉLÉ — les 10 dernières secondes : uniquement un chiffre géant (10 → 1).
function teleFinal() {
  document.body.classList.add("mode-tele");
  FEE.stop(); stopHerbes();
  app.innerHTML = `<div class="tf-wrap"><div class="tf-num" id="tf-num">10</div></div>`;
  clearInterval(tickTimer); clearTimeout(tickTimer);
  const maj = () => {
    const diff = CONFIG.dateLancement.getTime() - Date.now();
    if (diff <= 0) { clearInterval(tickTimer); teleLancement(); return; }
    const n = Math.max(1, Math.ceil(diff / 1000));
    const el = document.getElementById("tf-num");
    if (el && el.textContent != n) {
      el.textContent = n;
      el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    }
  };
  maj();
  tickTimer = setInterval(maj, 100);   // 100 ms : bascule nette pile à zéro
}

// 📺 TÉLÉ — l'instant du lancement : confettis + mot de fête, 15 s, puis classement.
function teleLancement() {
  document.body.classList.add("mode-tele");
  FEE.stop();
  clearInterval(tickTimer); clearTimeout(tickTimer);
  app.innerHTML = `<div class="tf-wrap tl-wrap">
    <div class="tl-emoji">🎉</div>
    <div class="tl-titre">C'est parti ! · We zijn vertrokken!</div>
    <div class="tl-sous">Le grand quiz Famiformation est lancé 🌱 · De grote Famiformation-quiz is gestart</div>
  </div>`;
  lanceConfettis(9000);
  tickTimer = setTimeout(() => renderTeleBoard(), 15000);   // 15 s de fête
}

// 🎉 Pluie de confettis (décorative). La couche vit au-dessus de #app et survit
// à un re-rendu, puis se retire toute seule.
function lanceConfettis(ms = 6000) {
  const couleurs = ["#2E7D32", "#F7C13A", "#E4572E", "#4EA5D9", "#F2A2C4", "#8BC34A", "#FFFFFF"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  document.body.appendChild(layer);
  const N = 130;
  for (let i = 0; i < N; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = (Math.random() * 100) + "vw";
    c.style.background = couleurs[i % couleurs.length];
    c.style.animationDuration = (2.3 + Math.random() * 1.9) + "s";
    c.style.animationDelay = (Math.random() * 0.7) + "s";
    c.style.setProperty("--rot", (Math.random() * 900 - 300) + "deg");
    c.style.setProperty("--drift", (Math.random() * 34 - 17) + "vw");
    if (Math.random() < 0.5) c.style.borderRadius = "50%";
    layer.appendChild(c);
  }
  setTimeout(() => layer.remove(), ms + 2500);
}

/* ============================================================
   ❓ VUE — QUIZ
   ============================================================ */

// Passe à la question suivante (ou termine le quiz). Appelé après la phase de
// correction, quand le joueur clique sur « Suivant ».
async function avanceQuiz() {
  if (quiz.idx + 1 < quiz.questions.length) { quiz.idx++; renderQuiz(); return; }
  // 🎯 QUIZ DU JARDIN : on ne touche PAS au classement. On crédite des graines
  // de jardin (10 par bonne réponse), puis écran dédié + retour au jardin.
  if (quiz.jardinMode) {
    quiz.step = "fin"; renderQuiz();
    const r = await apiQuizJardin(quiz.correct).catch(() => ({ ok: false }));
    if (r && r.ok) { joueur.solde = r.solde; if (r.recoltees != null) joueur.recoltees = r.recoltees; }
    quiz.gainJardin = (r && r.gain) || 0;
    quiz.step = "doneJardin"; renderQuiz();
    return;
  }
  // Dernière question : on inscrit la récolte sur le compte (déjà créé).
  quiz.step = "fin"; renderQuiz();
  const time = Math.round((Date.now() - quiz.start) / 1000);
  quiz.tempsTotal = time;          // pour l'afficher sur l'écran de fin
  quiz.score = arr1(quiz.score);   // score final à virgule (les décimales départagent)
  await apiSubmit({ name: quiz.pseudo, pseudo: (joueur && joueur.pseudo) || "", code: quiz.code, nom: quiz.nom, score: quiz.score, correct: quiz.correct, time }).catch(() => {});
  sauveMoi(quiz.pseudo, quiz.code);                    // l'appareil perso se souvient
  if (!joueur) joueur = { name: quiz.pseudo, code: quiz.code, nbCodes: 0 };
  joueur.recoltees = quiz.score;
  joueur.quizFait = true;                              // le jardin se débloque
  const s = await apiSolde(quiz.pseudo).catch(() => null);
  joueur.solde = (s && s.exists) ? s.solde : quiz.score;
  board = await apiGetBoard();
  quiz.messageCode = await reclamerEnAttente();        // un code scanné avant de jouer ?
  quiz.step = "done"; renderQuiz();
}

function renderQuiz() {
  clearInterval(tickTimer);
  // Hors période d'ouverture, on repasse à l'accueil / tableau de bord.
  if (phaseNow() !== "ouvert" && !toutOuvert()) { render(); return; }
  // Nouveau flux : on joue APRÈS s'être identifié (création/connexion). Donc pas
  // de compte → on renvoie à l'espace. « Quiz déjà fait » ne bloque QU'AU
  // DÉMARRAGE (quiz null) : une partie en cours ou son écran final doivent pouvoir
  // s'afficher même si quizFait vient de passer à true.
  if (!joueur) { userView = "espace"; render(); return; }
  // En mode test (simulation), on peut REJOUER le quiz autant de fois qu'on veut.
  if (!quiz && joueur.quizFait && !toutOuvert()) { userView = "dashboard"; render(); return; }

  // On démarre directement le quiz avec la carte déjà en poche (plus d'intro).
  if (!quiz) quiz = { step: "play", pseudo: joueur.name, code: joueur.code, nom: "", error: "", questions: prepareQuestions(), idx: 0, correct: 0, start: Date.now(), score: 0, streak: 0, qStart: Date.now() };

  // ---- (fallback) Ancienne inscription intégrée au quiz — inutilisée dans le
  // nouveau flux, conservée par sécurité si quiz.step vaut « intro ». ----
  if (quiz.step === "intro") {
    app.innerHTML = `<div class="card">
      <div class="center"><div style="font-size:2.8rem;">🌱</div>
        <h2 class="q-text" style="margin:8px 0 14px;">Bienvenue, futur jardinier !</h2></div>
      ${quiz.error ? `<div class="alert">${esc(quiz.error)}</div>` : ""}
      <label class="lbl">Ton pseudo de jardinier</label>
      <input class="field" id="q-pseudo" placeholder="Ex : SuperMarie" maxlength="24" value="${esc(quiz.pseudo)}">
      <label class="lbl">Ton code secret de jardinier 🌱 (4 chiffres)</label>
      <input class="field" id="q-code" inputmode="numeric" maxlength="4" placeholder="Ex : ton année de naissance" value="${esc(quiz.code)}">
      <p class="mini-warn">⚠️ N'oublie pas ton pseudo et ton code : c'est ce qui te permet de retrouver ton jardin sur un autre téléphone.</p>
      <details class="plus"><summary>🌿 Compléter ma fiche (optionnel)</summary>
        <p class="hint" style="margin-top:8px;">Donne ton nom et prénom : ça permettra aux organisateurs de retrouver ton compte si tu oublies ton code — et de te remettre ton prix si tu gagnes. Pas obligatoire !</p>
        <input class="field" id="q-nom" placeholder="Nom Prénom (facultatif)" maxlength="60" value="${esc(quiz.nom)}">
      </details>
      <button class="btn" id="q-start" style="width:100%;">C'est parti ! 🚀</button>
      <p class="center" style="margin-top:12px;"><a href="#" id="q-retrouver" class="lien">J'ai déjà un compte</a></p>
      <details class="plus" style="margin-top:10px;"><summary>▸ En savoir plus</summary>
        <p class="hint" style="margin-top:8px;">Cette étape crée ton compte pour le grand quiz Famiflora : réponds aux questions, récolte des graines 🌱, trouve des codes bonus en magasin et fais fleurir ton jardin ! Ton pseudo apparaît au classement.</p>
      </details>
      <p class="center" style="margin-top:8px;"><a href="#" id="q-conf" class="lien conf">Politique de confidentialité</a></p>
    </div>`;
    $("#q-code").addEventListener("keydown", (e) => e.key === "Enter" && $("#q-start").click());
    $("#q-retrouver").addEventListener("click", (e) => { e.preventDefault(); quiz = null; userView = "retrouver"; render(); });
    $("#q-conf").addEventListener("click", (e) => { e.preventDefault(); ouvrePolitique(); });
    $("#q-start").addEventListener("click", async () => {
      const pseudo = $("#q-pseudo").value.trim();
      const code = $("#q-code").value.replace(/\D/g, "").slice(0, 4);
      quiz.pseudo = pseudo; quiz.code = code; quiz.nom = $("#q-nom").value.trim();
      if (pseudo.length < 2) { quiz.error = "Choisis un nom de jardinier (au moins 2 lettres) 🙂"; renderQuiz(); return; }
      if (code.length !== 4) { quiz.error = "Ton code jardinier doit faire 4 chiffres 🔢"; renderQuiz(); return; }
      $("#q-start").disabled = true;
      const exists = await apiCheckName(pseudo).catch(() => false);
      if (exists) {
        quiz.error = "Ce nom de jardinier est déjà pris ! Choisis-en un autre — ou clique « retrouver mon jardin » si c'est bien toi.";
        renderQuiz(); return;
      }
      quiz.error = ""; quiz.start = Date.now(); quiz.step = "play";
      renderQuiz();
    });
    return;
  }

  // ---- Petit écran transitoire pendant l'enregistrement ----
  if (quiz.step === "fin") {
    app.innerHTML = `<div class="card center"><div style="font-size:2.6rem;">🌱</div>
      <h2 class="q-text">${t("On récolte tes graines…", "We oogsten je zaadjes…")}</h2></div>`;
    return;
  }

  if (quiz.step === "play") {
    const q = quiz.questions[quiz.idx];
    const graines = arr1(quiz.score);
    const stade = stadeDe(quiz.score);
    const rev = quiz.reveal;   // { chosen, good } dès que la question a été répondue
    if (!rev) quiz.qStart = Date.now();   // ⏱ départ du chrono (pas de reset pendant la correction)
    app.innerHTML = `<div class="card">
      <div class="q-plante">
        <span class="stade">
          <span class="emo ${quiz.vientDePousser ? "pousse-pop" : ""}">${stade.emoji}</span>
          <span class="nom">${stade.nom}</span>
        </span>
        <span class="graines">${affG(graines)} 🌰${quiz.lastGain ? `<span class="gain">+${affG(quiz.lastGain)}</span>` : ""}${quiz.streak >= 2 ? `<span class="serie">🔥 ${quiz.streak}</span>` : ""}</span>
      </div>
      <div class="q-progress"><div style="width:${(quiz.idx / quiz.questions.length) * 100}%"></div></div>
      <div class="q-num">${t("Question", "Vraag")} ${quiz.idx + 1} / ${quiz.questions.length}</div>
      <div class="q-text">${esc(q.q)}</div>
      ${q.options.map((o, i) => {
        let cls = "q-opt";
        let tag = "";
        if (rev) {
          cls += " reveal";
          if (o.good) { cls += " q-opt-good"; tag = `<span class="opt-tag">${t("✓ bonne réponse", "✓ juist antwoord")}</span>`; }
          else if (i === rev.chosen) { cls += " q-opt-bad"; tag = `<span class="opt-tag">${t("✗ ton choix", "✗ jouw keuze")}</span>`; }
        }
        return `<button class="${cls}" data-i="${i}"${rev ? " disabled" : ""}>${esc(o.text)}${tag}</button>`;
      }).join("")}
      ${rev ? `<div class="q-feedback ${rev.good ? "ok" : "ko"}">${rev.good
          ? t("✅ Bravo, bonne réponse !", "✅ Bravo, juist antwoord!")
          : t("❌ Raté ! La bonne réponse est surlignée en vert.", "❌ Mis! Het juiste antwoord staat in het groen.")}</div>
        <button class="btn" id="q-suivant" style="width:100%; margin-top:10px;">${quiz.idx + 1 < quiz.questions.length ? t("Question suivante ➜", "Volgende vraag ➜") : t("Voir mon résultat ➜", "Bekijk mijn resultaat ➜")}</button>` : ""}
    </div>`;

    // Phase CORRECTION : on attend le clic sur « Suivant » avant d'avancer.
    if (rev) {
      $("#q-suivant").addEventListener("click", () => { quiz.reveal = null; avanceQuiz(); });
      return;
    }

    // ⏱ Plus de chrono affiché (trop stressant). On mesure quand même le temps de
    // réponse en interne, pour un tout petit bonus qui ne sert qu'à départager les
    // ex æquo au classement — mais rien ne s'affiche, aucune pression.
    clearInterval(chronoQ);

    app.querySelectorAll(".q-opt").forEach((btn) => btn.addEventListener("click", () => {
      if (quiz.reveal) return;                            // déjà répondu
      clearInterval(chronoQ);
      const i = +btn.dataset.i;
      const avant = stadeDe(quiz.score);
      const tSec = (Date.now() - quiz.qStart) / 1000;     // temps de réponse (avec décimales)
      const good = q.options[i].good;
      if (good) {
        quiz.streak++;
        const gain = gainReponse(tSec, quiz.streak);      // base + rapidité (ratio) + série
        quiz.score += gain;
        quiz.correct++;
        quiz.lastGain = arr1(gain);
      } else {
        quiz.streak = 0;
        quiz.lastGain = 0;
      }
      const apres = stadeDe(quiz.score);
      quiz.vientDePousser = apres.min !== avant.min;       // la plante vient de changer de stade
      quiz.reveal = { chosen: i, good };                   // → on affiche la correction
      renderQuiz();
    }));
    return;
  }

  // 🎯 Fin d'un QUIZ DU JARDIN : on annonce les graines de jardin gagnées.
  if (quiz.step === "doneJardin") {
    app.innerHTML = `<div class="card center">
      <div style="font-size:3.4rem; line-height:1.1;">🌼</div>
      <h2 class="q-text" style="margin:8px 0 4px;">${t("Belle récolte pour ton jardin !", "Mooie oogst voor je tuin!")}</h2>
      <div class="score-big">+${affG(quiz.gainJardin)} 🌰</div>
      <p class="hint" style="margin-top:12px;"><b>${quiz.correct} ${t("bonne" + (quiz.correct > 1 ? "s" : "") + " réponse" + (quiz.correct > 1 ? "s" : "") + " sur " + quiz.questions.length, "juist" + (quiz.correct > 1 ? "e" : "") + " antwoord" + (quiz.correct > 1 ? "en" : "") + " op " + quiz.questions.length)}</b>
        — ${t("ces graines vont <b>directement dans ton jardin</b> (ton classement ne bouge pas).", "deze zaadjes gaan <b>rechtstreeks naar je tuin</b> (je ranking verandert niet).")}<br>
        ${t("Tu as maintenant <b>" + affG(joueur.solde) + " 🌰</b> à planter. Rejoue autant que tu veux pour finir ton jardin&nbsp;! 🌱", "Je hebt nu <b>" + affG(joueur.solde) + " 🌰</b> om te planten. Speel zoveel je wil om je tuin af te werken&nbsp;! 🌱")}</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <button class="btn" id="qj-jardin">${t("🌼 Retour au jardin", "🌼 Terug naar de tuin")}</button>
        <button class="btn ghost" id="qj-rejouer">${t("🎯 Rejouer un quiz", "🎯 Opnieuw een quiz")}</button>
      </div>
    </div>`;
    $("#qj-jardin").addEventListener("click", async () => { jardin = await apiJardin(); userView = "jardin"; quiz = null; render(); });
    $("#qj-rejouer").addEventListener("click", () => {
      quiz = { jardinMode: true, step: "play", pseudo: joueur.name, questions: prepareQuestions(),
               idx: 0, correct: 0, start: Date.now(), score: 0, streak: 0, qStart: Date.now() };
      render();
    });
    return;
  }

  // done
  const stadeFinal = stadeDe(quiz.score);
  app.innerHTML = `<div class="card center">
    <div style="font-size:4.2rem; line-height:1.1;">${stadeFinal.emoji}</div>
    <h2 class="q-text" style="margin-bottom:6px;">${t("Bravo " + esc((joueur && joueur.pseudo) || quiz.pseudo) + ", te voilà « " + stadeFinal.nom + " » !", "Bravo " + esc((joueur && joueur.pseudo) || quiz.pseudo) + ", je bent nu « " + stadeFinal.nom + " »!")}</h2>
    <div class="score-big">${affG(joueur.recoltees)} 🌰</div>
    <p class="hint" style="margin-top:14px;">
      <b>${quiz.correct} ${t("bonne" + (quiz.correct > 1 ? "s" : "") + " réponse" + (quiz.correct > 1 ? "s" : "") + " sur " + quiz.questions.length, "juist" + (quiz.correct > 1 ? "e" : "") + " antwoord" + (quiz.correct > 1 ? "en" : "") + " op " + quiz.questions.length)}</b>
      · ⏱ ${t((quiz.tempsTotal ?? 0) + " s au total (soit " + ((quiz.tempsTotal ?? 0) / quiz.questions.length).toFixed(1).replace(".", ",") + " s par question).", (quiz.tempsTotal ?? 0) + " s in totaal (dus " + ((quiz.tempsTotal ?? 0) / quiz.questions.length).toFixed(1).replace(".", ",") + " s per vraag).")}
      ${quiz.messageCode ? `<br>${esc(quiz.messageCode)}` : ""}
      <br>${t("Trouve des codes bonus en magasin (+" + CONFIG.pointsParCodeBonus + " 🌰 chacun, " + CONFIG.maxCodes + " max) : eux comptent au classement !", "Vind bonuscodes in de winkel (+" + CONFIG.pointsParCodeBonus + " 🌰 per stuk, max " + CONFIG.maxCodes + "): die tellen mee in de ranking!")}
      <br>${t("Annonce des vainqueurs le " + CONFIG.dateResultats + " — bonne chance ! 🍀", "Bekendmaking van de winnaars op " + CONFIG.dateResultats + " — veel succes! 🍀")}</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="q-jardin">${t("🌼 Planter dans mon jardin", "🌼 Planten in mijn tuin")}</button>
      <button class="btn ghost" id="q-board">${t("Voir le classement 🏆", "Bekijk de ranking 🏆")}</button>
    </div>
    <p class="center" style="margin-top:12px;"><button class="lien-explik" id="q-explik">${t("✨ Comment ça marche ? Découvre tout ce que tu peux faire", "✨ Hoe werkt het? Ontdek alles wat je kan doen")}</button></p>
  </div>`;
  $("#q-explik").addEventListener("click", ouvreExplication);
  $("#q-jardin").addEventListener("click", async () => {
    jardin = await apiJardin();
    userView = "jardin";
    quiz = null;
    render();
  });
  $("#q-board").addEventListener("click", () => {
    userView = "board";
    quiz = null;
    render();
  });
  // Petite fenêtre qui annonce la fin du quiz (une seule fois par partie).
  if (!quiz.modaleFinVue) { quiz.modaleFinVue = true; modaleQuizFini(joueur.recoltees || 0); }
}

// 🎉 Modale de fin de quiz : annonce la récolte et invite à planter (sans jamais
// impacter le classement, on le répète pour lever le doute sur la thésaurisation).
function modaleQuizFini(graines) {

      ${t("🎁 Et surtout : <b>va au bout de ton jardin et tu gagnes une récompense toi aussi</b>, même sans être sur le podium !", "🎁 En vooral: <b>werk je tuin af en jij wint ook een beloning</b>, ook zonder op het podium te staan!")}</p>
    <div class="cm-modules">
      <button class="cm-mod" data-qf="jardin"><span class="cm-mod-emo">🌼</span><span class="cm-mod-titre">${t("Mon jardin", "Mijn tuin")}</span></button>

// (ou s'est identifié) : il peut circuler entre les deux librement.
function pillsHtml(active) {
  return `<div class="pills">

}
function bindPills() {
  app.querySelectorAll(".pills button").forEach((b) => b.addEventListener("click", async () => {
    if (b.dataset.p === "reclamer") { codeAReclamer = null; }
    if (b.dataset.p === "jardin") {
      jardin = await apiJardin();
      if (joueur) {
        const s = await apiSolde(joueur.name).catch(() => null);
        if (s && s.exists) joueur.solde = s.solde;
      }

function renderBoard() {
  clearInterval(tickTimer);
  if (!espaceAccessible()) { retourAccueilVerrou(); return; }   // 🔒 classement fermé avant le lancement
  const fini = phaseNow() === "termine";
  const titre = `<div class="board-titre">${fini ? t("🏆 Résultats finaux <span>— merci d'avoir joué !</span>", "🏆 Eindresultaten <span>— bedankt voor het spelen!</span>") : t("🏆 Classement en direct", "🏆 Live ranking")}</div>`;
  // On ne montre QUE ceux qui ont joué (un compte réservé mais pas encore joué
  // n'apparaît pas). Le serveur filtre déjà ; ici c'est utile en simulation.
  const lignes = board.filter((p) => p.quiz_fait !== false && !COMPTES_TEST.includes((p.name || "").toLowerCase()));
  if (!lignes.length) {
    app.innerHTML = `${pillsHtml("board")}<div class="card center">${titre}
      <p class="hint">${fini ? t("Le quiz est terminé.", "De quiz is afgelopen.") : t("Sois le premier ou la première à jouer ! 🌱", "Wees de eerste om te spelen! 🌱")}</p></div>`;
    bindPills();
    return;
  }
  // Ma ligne à moi : si je suis identifié, je la mets en avant (score + rang) et
  // je propose d'aller directement dans mon jardin.
  const moiRang = joueur ? lignes.findIndex((p) => p.name.toLowerCase() === joueur.name.toLowerCase()) : -1;
  const moiHtml = (moiRang >= 0) ? `<div class="moi-score">
      <div class="moi-rang">${moiRang < 3 ? medals[moiRang] : "#" + (moiRang + 1)}</div>
      <div class="moi-info">
        <div class="moi-nom">${esc(nomAff(lignes[moiRang]))} — ${t("c'est toi ! 🌱", "dat ben jij! 🌱")}</div>
        <div class="moi-pts">${affG(lignes[moiRang].score)} ${t("graines récoltées", "zaadjes geoogst")}${moiRang < 3 ? t(" · sur le podium ! 🎉", " · op het podium! 🎉") : ""}</div>
      </div>
      <button class="btn" id="moi-jardin">${t("🌼 Mon jardin", "🌼 Mijn tuin")}</button>
    </div>` : "";
  const top3 = lignes.slice(0, 3);
  const rest = lignes.slice(3);
  const order = [1, 0, 2];
  app.innerHTML = `<div class="board-wrap">${pillsHtml("board")}<div class="card">
    ${titre}
    ${moiHtml}
    <div class="podium">
      ${order.map((pos) => top3[pos] ? `
        <div class="pod p${pos + 1}${moiRang === pos ? " moi" : ""}">
          <div class="pod-medal">${medals[pos]}</div>
          <div class="pod-name">${esc(nomAff(top3[pos]))}</div>
          <div class="pod-pts">${affG(top3[pos].score)} 🌰</div>
        </div>` : "").join("")}
    </div>
    ${rest.map((p, i) => `
      <div class="rank-row${moiRang === i + 3 ? " moi" : ""}">
        <span class="rank-pos">${i + 4}.</span>
        ${avatarDe(nomAff(p))}
        <span class="rank-nom"><span class="qui">${esc(nomAff(p))}</span></span>
        <span class="rank-pts">${affG(p.score)} 🌰</span>
      </div>`).join("")}
    <div class="center home-liens" style="margin-top:18px;">
      <button class="btn ghost" id="b-refresh">${t("Actualiser 🔄", "Vernieuwen 🔄")}</button>
      ${!joueur ? `<button class="btn ghost" id="b-compte">${t("🌱 Retrouver mon jardin", "🌱 Mijn tuin terugvinden")}</button>` : ""}
      <button class="lien-explik" id="b-explik">${t("✨ Comment ça marche ?", "✨ Hoe werkt het?")}</button>
    </div>
  </div></div>`;
  bindPills();
  const mj = $("#moi-jardin");
  if (mj) mj.addEventListener("click", async () => {
    jardin = await apiJardin();
    const s = await apiSolde(joueur.name).catch(() => null);
    if (s && s.exists) joueur.solde = s.solde;
    userView = "jardin"; render();
  });
  const bc = $("#b-compte");
  if (bc) bc.addEventListener("click", () => { jardinMsg = null; userView = "retrouver"; quiz = null; render(); });
  $("#b-explik").addEventListener("click", ouvreExplication);
  $("#b-refresh").addEventListener("click", async () => { board = await apiGetBoard(); render(); });
  // 🔧 On réconcilie les barres flottantes même si renderBoard a été appelée
  // directement (hors du routeur render) : sinon la barre borne « Retour/Accueil »
  // ou le bouton Déconnexion pouvaient rester affichés à tort en changeant de vue.
  majNavBorne("board"); majDeco("board");
}

/* ============================================================

   Chacun dépense ses graines pour planter sur la grille commune.

// 💎 Les plantes RARES sont de vraies fleurs entièrement métalliques (or, argent,
// bronze) qui brillent. Les dégradés sont définis une fois, et chaque fleur les
// réutilise. La forme : 10 pétales autour d'un cœur, avec un reflet spéculaire.
const DEFS_METAL = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="mfl-or" cx="38%" cy="30%" r="80%">
    <stop offset="0" stop-color="#FFFAD6"/><stop offset="30%" stop-color="#FFE06A"/>
    <stop offset="66%" stop-color="#E8A61A"/><stop offset="100%" stop-color="#8F620A"/></radialGradient>
  <radialGradient id="mfl-argent" cx="38%" cy="30%" r="80%">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#EAEFF5"/>
    <stop offset="66%" stop-color="#AEB8C6"/><stop offset="100%" stop-color="#727C8B"/></radialGradient>
  <radialGradient id="mfl-bronze" cx="38%" cy="30%" r="80%">
    <stop offset="0" stop-color="#F9E2C4"/><stop offset="30%" stop-color="#E3A468"/>
    <stop offset="66%" stop-color="#B87333"/><stop offset="100%" stop-color="#6F4318"/></radialGradient>
</defs></svg>`;

function fleurRareSvg(tier) {
  const g = `url(#mfl-${tier})`;
  let petales = "";
  for (let i = 0; i < 10; i++) {
    petales += `<ellipse cx="50" cy="21" rx="9" ry="19" fill="${g}" stroke="rgba(0,0,0,.14)" stroke-width="1" transform="rotate(${i * 36} 50 50)"/>`;
  }
  return `<svg class="fleur-rare" viewBox="0 0 100 100">${petales}
    <circle cx="50" cy="50" r="16" fill="${g}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>
    <circle cx="50" cy="50" r="8" fill="rgba(0,0,0,.12)"/>
    <ellipse class="glint" cx="43" cy="42" rx="6" ry="4" fill="rgba(255,255,255,.85)"/>
  </svg>`;
}
// 🍦 L'ARBRE À TICKETS GLACE : le vrai arbre que la fée fait pousser, avec les
// tickets glace BLEUS pendus aux branches (pas un emoji). Repris du dessin de la fée.
const TICKET_GLACE = `<rect x="2" y="2" width="166" height="100" rx="12" fill="url(#glaceTgJ)" stroke="#152c6b" stroke-width="3"></rect><rect x="10" y="12" width="106" height="80" rx="7" fill="#fff" stroke="#152c6b" stroke-width="1.6"></rect><text x="24" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#1c1c1c" font-style="italic">1x</text><text x="18" y="72" font-family="Arial,sans-serif" font-size="15" font-weight="900" fill="#1c1c1c" font-style="italic">GRATUIT</text><path d="M118 60 L152 60 L135 98 Z" fill="#e8a94a" stroke="#152c6b" stroke-width="1.5"></path><path d="M116 58 C110 40 118 26 128 24 C126 12 146 8 150 20 C160 18 166 30 158 38 C166 44 158 58 150 56 Z" fill="#fdf6e6" stroke="#152c6b" stroke-width="1.6"></path>`;
function arbreGlaceSvg() {
  // 🍦 EXACTEMENT l'arbre à tickets glace que la fée fait pousser : un pot en
  // terre cuite + l'arbre avec ses tickets bleus « 1x GRATUIT ».
  const T = (x, y) => `<g transform="translate(${x},${y}) scale(0.3)">${TICKET_GLACE}</g>`;
  return `<svg class="arbre-glace" viewBox="40 24 140 236" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="feePotJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C97B4A"/><stop offset="1" stop-color="#9C5730"/></linearGradient>
      <linearGradient id="glaceTgJ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9bf5"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    </defs>
    <rect x="102" y="98" width="16" height="74" rx="5" fill="#8A5B36"/>
    <circle cx="110" cy="60" r="40" fill="#2E7D3B"/><circle cx="76" cy="80" r="27" fill="#3C9147"/>
    <circle cx="144" cy="80" r="27" fill="#3C9147"/><circle cx="110" cy="78" r="31" fill="#4E9E52"/>
    ${T(46, 82)}${T(120, 86)}${T(84, 104)}
    <path d="M56 168 L164 168 L152 246 Q 110 254 68 246 Z" fill="url(#feePotJ)"/>
    <rect x="48" y="150" width="124" height="24" rx="7" fill="#D98A57"/>
    <ellipse cx="110" cy="172" rx="52" ry="9" fill="#5C3A21"/>
  </svg>`;
}

// 🎟️ Un ticket glace bleu seul (le « 1x GRATUIT » du site), pour les modules et
// les petits messages (là où l'arbre entier serait trop gros).
function ticketGlaceSvg(cls = "") {
  return `<svg class="ticket-glace ${cls}" viewBox="0 0 170 104" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="glaceTgJ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9bf5"/><stop offset="1" stop-color="#1e40af"/></linearGradient></defs>
    ${TICKET_GLACE}</svg>`;
}

// Ce qui s'affiche dans une case : fleur métallique (rares), arbre à tickets glace,
// sinon l'emoji de la plante.
function visuelPlante(cle) {
  const p = PLANTES[cle];
  if (p && p.rare) return fleurRareSvg(p.rare);
  if (cle === "arbreglace") return arbreGlaceSvg();
  return p?.emoji || "🌿";
}

// Petite icône inline pour les messages : ticket glace (arbre), fleur rare, sinon emoji.
function iconePlante(cle) {
  if (cle === "arbreglace") return ticketGlaceSvg("tk-inline");
  const p = PLANTES[cle];
  if (p && p.rare) return `<span class="tk-inline">${fleurRareSvg(p.rare)}</span>`;
  return p?.emoji || "🌿";
}

// Classement des plus beaux jardins : par VALEUR totale des plantes posées.
function classementJardins() {
  const val = {};
  for (const k in jardin) {
    const c = jardin[k];
    if (/^Famiflora/.test(c.par)) continue;   // les plantations de l'organisateur ne comptent pas
    val[c.par] = (val[c.par] || 0) + (PLANTES[c.plante]?.cout || 0);
  }
  return Object.entries(val).map(([name, valeur]) => ({ name, valeur })).sort((a, b) => b.valeur - a.valeur);
}

function renderJardin() {
  clearInterval(tickTimer);
  if (!espaceAccessible()) { retourAccueilVerrou(); return; }   // 🔒 jardin fermé avant le lancement

  // Pas encore identifié (nouveau téléphone) : on invite à retrouver sa carte.

  }

  // Le stade (🌰🌱🪴…) suit les graines RÉCOLTÉES au quiz — jamais le solde
  // disponible, sinon planter ferait « rapetisser » le joueur.
  const stade = stadeDe(joueur.recoltees ?? (joueur.solde + soldeDepense()));
  const nbPlantees = Object.keys(jardin).length;
  // 🎁 Éligibilité récompense « jardin » : toutes les cases occupées ET les 3 lotus plantés.
  const LOTUS = ["or", "argent", "bronze"];
  const lotusFaits = LOTUS.filter((r) => Object.values(jardin).some((c) => c && c.plante === r)).length;
  const eligible = nbPlantees >= JARDIN_CASES && lotusFaits === 3;

  // 🎉 Au moment PRÉCIS où l'objectif est atteint : une modale « tu as gagné »,
  // une seule fois (mémorisé pour ne pas re-popper à chaque visite/rechargement).
  if (eligible && !jardinObjectifFete) {
    const cle = "fj_jgagne_" + SITE + "_" + (joueur ? joueur.name.toLowerCase() : "");
    let deja = false;
    if (!SIMULATION) { try { deja = localStorage.getItem(cle) === "1"; } catch (e) {} }
    if (!deja) {
      jardinObjectifFete = true;
      if (!SIMULATION) { try { localStorage.setItem(cle, "1"); } catch (e) {} }
      setTimeout(() => modaleJardinGagne(), 500);   // après le rendu de la grille
    }

      <span class="montant">${JARDIN_LIBRE ? t("🎨 Aperçu — plantes offertes", "🎨 Voorbeeld — planten gratis") : affG(joueur.solde) + t(" 🌰 à planter", " 🌰 om te planten")}</span>
    </div>
    ${JARDIN_LIBRE ? "" : `<div class="j-objectif ${eligible ? "j-objectif-ok" : ""}">
      <div class="jo-titre">${t("🎁 Objectif récompense", "🎁 Doel: beloning")}</div>
      ${eligible
        ? `<div class="jo-ok">${t("Bravo&nbsp;! Ton jardin est complet et tes <b>3 lotus</b> sont plantés — tu fais partie des <b>gagnants du jardin</b> 🌟", "Bravo&nbsp;! Je tuin is volledig en je <b>3 lotussen</b> zijn geplant — je hoort bij de <b>winnaars van de tuin</b> 🌟")}</div>`
        : `<div class="jo-progress"><div class="jo-barre"><div style="width:${Math.round(nbPlantees / JARDIN_CASES * 100)}%"></div></div>
           <span class="jo-chiffres"><b>${nbPlantees}/${JARDIN_CASES}</b> ${t("cases", "vakjes")} · <b>${lotusFaits}/3</b> ${t("lotus", "lotus")} 🌼</span></div>
           <div class="jo-aide">${t("Remplis <b>toutes</b> tes cases et plante les <b>3 lotus (or, argent, bronze)</b> pour gagner ta récompense.", "Vul <b>al</b> je vakjes en plant de <b>3 lotussen (goud, zilver, brons)</b> om je beloning te winnen.")}</div>`}
    </div>`}
    <div class="jardin-explik">
      <b>${t("🌼 Ton jardin, comment ça marche ?", "🌼 Je tuin, hoe werkt het?")}</b>
      ${t("Choisis une plante dans le catalogue, puis tape une case libre pour la planter. Tape une plante déjà en terre pour la <b>revendre</b> et récupérer tes graines.", "Kies een plant uit de catalogus en tik op een vrij vakje om ze te planten. Tik op een reeds geplante plant om ze <b>terug te verkopen</b> en je zaadjes te recupereren.")}
      ${t("Tu as " + JARDIN_CASES + " cases rien qu'à toi (" + nbPlantees + " déjà occupée" + (nbPlantees > 1 ? "s" : "") + ").", "Je hebt " + JARDIN_CASES + " vakjes helemaal voor jou (" + nbPlantees + " al bezet).")}
      <span class="je-rassure">${t("💚 En plantant, ton nombre de graines à planter diminue : <b>c'est normal, ça ne concerne que le jardin</b>. <b>Ton score au classement ne bouge pas</b> — va voir dans « Classement », il sera toujours le même.", "💚 Bij het planten daalt je aantal zaadjes om te planten: <b>dat is normaal, het geldt enkel voor de tuin</b>. <b>Je score in de ranking verandert niet</b> — kijk maar in « Ranking », die blijft dezelfde.")}</span>
    </div>
    ${JARDIN_LIBRE ? "" : `<div class="j-gagner">
      <button class="btn" id="j-quiz">${t("🎯 Quiz du jardin", "🎯 Tuinquiz")}</button>
      <button class="btn ghost" id="j-herbes">${t("🌿 Chasse aux herbes", "🌿 Onkruid vangen")}</button>

  </div></div>`;
  bindPills();

  const jh = $("#j-herbes");
  if (jh) jh.addEventListener("click", () => { userView = "herbes"; render(); });
  const jq = $("#j-quiz");
  if (jq) jq.addEventListener("click", () => {
    // Quiz REJOUABLE pour le jardin : mêmes questions (tirage au hasard), mais
    // chaque bonne réponse rapporte des graines de jardin, PAS le classement.
    quiz = { jardinMode: true, step: "play", pseudo: joueur.name, questions: prepareQuestions(),
             idx: 0, correct: 0, start: Date.now(), score: 0, streak: 0, qStart: Date.now() };
    userView = "quiz"; render();
  });

  // Choisir une plante dans le catalogue
  app.querySelectorAll("[data-plt]").forEach((b) => b.addEventListener("click", () => {
    planteChoisie = planteChoisie === b.dataset.plt ? null : b.dataset.plt;
    jardinMsg = null;
    renderJardin();
  }));

  // Une case occupée : afficher qui a planté quoi. Si c'est MA plante, je peux
  // la revendre pour récupérer mes graines.
  app.querySelectorAll("[data-info]").forEach((b) => b.addEventListener("click", () => {
    const idx = b.dataset.info;
    const c = jardin[idx];
    if (!c) return;
    const p = PLANTES[c.plante];
    const info = $("#j-info");
    // C'est TON jardin : toutes les plantes sont à toi, tu peux les revendre.
    info.innerHTML = `<span class="revente">${p ? iconePlante(c.plante) : "🌿"} ${esc(p?.nom || c.plante)}`
      + ` <button class="btn mini" id="j-revendre">${t("Revendre", "Terugverkopen")} +${p?.cout ?? 0} 🌰</button></span>`;
    $("#j-revendre").addEventListener("click", async () => {
      $("#j-revendre").disabled = true;
      const res = await apiRevendre(joueur.name, +idx).catch(() => ({ ok: false }));
      if (res.ok) {
        delete jardin[idx];
        if (res.solde != null) joueur.solde = res.solde;
        jardinMsg = t("Plante revendue, +" + affG(res.rendu) + " 🌰 récupérées. Tu as " + affG(joueur.solde) + " graines.", "Plant terugverkocht, +" + affG(res.rendu) + " 🌰 gerecupereerd. Je hebt " + affG(joueur.solde) + " zaadjes.");
      } else {
        jardin = await apiJardin();
        jardinMsg = t("Petit souci, réessaie.", "Er ging iets mis, probeer opnieuw.");
      }
      renderJardin();
    });
  }));

  // Une case libre : planter la plante choisie
  app.querySelectorAll("[data-case]").forEach((b) => b.addEventListener("click", async () => {
    if (!planteChoisie) {
      $("#j-info").textContent = t("Choisis d'abord une plante dans le catalogue au-dessus 👆", "Kies eerst een plant uit de catalogus hierboven 👆");
      return;
    }
    const idx = +b.dataset.case;
    b.disabled = true;
    const res = await apiPlanter(joueur.name, idx, planteChoisie).catch(() => ({ ok: false, reason: "erreur" }));
    if (res.ok) {
      jardin[idx] = { plante: planteChoisie, par: joueur.name, date: new Date().toISOString() };
      joueur.solde = res.solde;
      const p = PLANTES[planteChoisie];
      jardinMsg = JARDIN_LIBRE ? t(p.emoji + " " + p.nom + " planté !", p.emoji + " " + p.nom + " geplant!") : t(p.emoji + " " + p.nom + " planté ! Il te reste " + affG(joueur.solde) + " graines.", p.emoji + " " + p.nom + " geplant! Je hebt nog " + affG(joueur.solde) + " zaadjes.");
      if (!JARDIN_LIBRE && p.cout > joueur.solde) planteChoisie = null; // plus les moyens pour la même
      renderJardin();
      const neuve = app.querySelector(`[data-info="${idx}"]`);
      if (neuve) { neuve.classList.add("neuve"); if (p.rare) etincellesSur(neuve); }
    } else {
      jardin = await apiJardin(); // on resynchronise la grille
      if (res.reason === "case_prise") jardinMsg = t("Oups, cette case vient d'être prise par quelqu'un d'autre ! Tes graines te sont rendues.", "Oeps, dit vakje is net door iemand anders ingenomen! Je zaadjes worden teruggegeven.");
      else if (res.reason === "solde_insuffisant") { jardinMsg = t("Il te manque des graines pour cette plante.", "Je hebt te weinig zaadjes voor deze plant."); joueur.solde = res.solde ?? joueur.solde; }
      else jardinMsg = t("Petit souci de connexion, réessaie !", "Verbindingsprobleempje, probeer opnieuw!");
      renderJardin();
    }
  }));
}

// Total déjà dépensé par le joueur (retrouvé depuis le classement affiché).
function soldeDepense() {
  const p = board.find((x) => x.name.toLowerCase() === (joueur?.name || "").toLowerCase());
  return p ? (p.depensees || 0) : 0;
}

// ✨ Gerbe d'étincelles au-dessus d'une case : quand on plante une plante RARE.
function etincellesSur(el) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span");
    s.className = "scintille";
    s.textContent = ["✨", "⭐", "💫", "🌟"][i % 4];
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", (Math.random() * 100 - 50).toFixed(0) + "px");
    s.style.setProperty("--dy", (-15 - Math.random() * 80).toFixed(0) + "px");
    s.style.animationDelay = (Math.random() * 0.2).toFixed(2) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }
}

/* ============================================================
   🌿 MINI-JEU — LA CHASSE AUX MAUVAISES HERBES
   Une fois le quiz fini on ne récolte plus de graines au quiz : ce petit jeu
   permet d'en gagner d'AUTRES à planter (elles ne comptent pas au classement).
   Des herbes surgissent ~25 s ; on tape dessus. Les bronze/argent/or sont
   rares mais rapportent plus. Le serveur recalcule et plafonne le gain.
   ============================================================ */

const HERBE_DUREE = 25;
const HERBE_TIERS = [
  { k: "normale", val: 1,  p: 0.68 },
  { k: "bronze",  val: 3,  p: 0.22 },
  { k: "argent",  val: 6,  p: 0.08 },
  { k: "or",      val: 12, p: 0.02 },
];

// Coupe une partie en cours (changement d'écran, rejeu…) : sans ça, les timers
// continueraient de faire apparaître des herbes en arrière-plan.
function stopHerbes() {
  if (!HG) return;
  HG.timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
  HG.timers = [];
  HG.running = false;
}

function renderHerbes() {
  clearInterval(tickTimer);
  stopHerbes();
  if (!joueur) { userView = "jardin"; render(); return; }  // pas identifié : retour jardin

  app.innerHTML = `<div class="board-wrap"><div class="card">
    <div class="herbe-top">
      <button class="btn ghost mini" id="h-retour">${t("← Jardin", "← Tuin")}</button>
      <span class="chrono" id="h-chrono">⏱ ${HERBE_DUREE} s</span>
      <span class="butin" id="h-butin">🌰 0</span>
    </div>
    <div class="herbe-zone" id="h-zone">
      <div id="h-overlay" class="herbe-overlay">
        <div style="font-size:2.4rem;">🌿</div>
        <h2 class="q-text" style="margin:0;">${t("Chasse aux mauvaises herbes", "Onkruid vangen")}</h2>
        <p class="hint" style="margin:0; max-width:340px;">${t("Tape un maximum de mauvaises herbes en " + HERBE_DUREE + " s ! Les <b style=\"color:#B87333;\">bronze</b>, <b style=\"color:#8A9099;\">argent</b> et <b style=\"color:#E9B21E;\">or</b> sont rares mais rapportent gros.", "Tik op zoveel mogelijk onkruid in " + HERBE_DUREE + " s! De <b style=\"color:#B87333;\">bronzen</b>, <b style=\"color:#8A9099;\">zilveren</b> en <b style=\"color:#E9B21E;\">gouden</b> zijn zeldzaam maar leveren veel op.")}</p>
        <button class="btn" id="h-go">${t("Commencer 🌱", "Beginnen 🌱")}</button>
      </div>
    </div>
    <div class="jardin-info" id="h-info"></div>
  </div></div>`;
  $("#h-retour").addEventListener("click", () => { userView = "jardin"; render(); });
  $("#h-go").addEventListener("click", demarreHerbes);
}

function demarreHerbes() {
  const zone = $("#h-zone");
  const overlay = $("#h-overlay");
  if (!zone) return;
  if (overlay) overlay.remove();

  HG = { timers: [], counts: { normale: 0, bronze: 0, argent: 0, or: 0 }, butin: 0, restant: HERBE_DUREE, running: true };
  const chrono = $("#h-chrono"), butinEl = $("#h-butin");

  // Le décompte.
  HG.timers.push(setInterval(() => {
    HG.restant--;
    if (chrono) chrono.textContent = "⏱ " + Math.max(0, HG.restant) + " s";
    if (HG.restant <= 0) finHerbes();
  }, 1000));

  const tire = () => {
    let r = Math.random(), acc = 0;
    for (const t of HERBE_TIERS) { acc += t.p; if (r < acc) return t; }
    return HERBE_TIERS[0];
  };

  const spawn = () => {
    if (!HG || !HG.running || !zone.isConnected) return;
    const t = tire();
    const b = document.createElement("button");
    b.className = "herbe h-" + t.k;
    b.innerHTML = `🌿<span class="val">+${t.val}</span>`;
    const marge = 38;
    const x = marge + Math.random() * Math.max(1, zone.clientWidth - marge * 2);
    const y = marge + Math.random() * Math.max(1, zone.clientHeight - marge * 2);
    b.style.left = x + "px";
    b.style.top = y + "px";
    let vive = true;
    const enleve = setTimeout(() => { if (vive) b.remove(); }, 1150);
    HG.timers.push(enleve);
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!vive || !HG || !HG.running) return;
      vive = false;
      clearTimeout(enleve);
      HG.counts[t.k]++;
      HG.butin += t.val;
      if (butinEl) butinEl.textContent = "🌰 " + HG.butin;
      b.classList.add("crunch");
      const g = document.createElement("div");
      g.className = "herbe-gain";
      g.textContent = "+" + t.val;
      g.style.left = x + "px"; g.style.top = y + "px";
      zone.appendChild(g);
      setTimeout(() => g.remove(), 700);
      setTimeout(() => b.remove(), 280);
    });
    zone.appendChild(b);
  };

  HG.timers.push(setInterval(spawn, 620));
  spawn();
}

async function finHerbes() {
  if (!HG || !HG.running) return;
  HG.running = false;
  HG.timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
  HG.timers = [];
  const zone = $("#h-zone");
  if (zone) zone.querySelectorAll(".herbe").forEach((e) => e.remove());

  const counts = HG.counts;
  const res = await apiRecolteHerbes(joueur.name, counts).catch(() => ({ ok: false }));
  const gagne = res.ok ? res.gain : 0;
  if (res.ok && res.solde != null) joueur.solde = res.solde;

  if (zone && zone.isConnected) {
    const o = document.createElement("div");
    o.id = "h-overlay";
    o.className = "herbe-overlay";
    o.innerHTML = `<div style="font-size:2.6rem;">🌱</div>
      <h2 class="q-text" style="margin:0;">+${gagne} ${t("graines récoltées !", "zaadjes geoogst!")}</h2>
      <p class="hint" style="margin:0;">${res.ok ? t("Tu as maintenant <b>" + affG(joueur.solde) + "</b> graines à planter.", "Je hebt nu <b>" + affG(joueur.solde) + "</b> zaadjes om te planten.") : t("La récolte n'a pas pu être enregistrée, réessaie.", "De oogst kon niet opgeslagen worden, probeer opnieuw.")}
      ${gagne >= 80 ? t("<br>Plafond de la partie atteint 🌟", "<br>Maximum van het spel bereikt 🌟") : ""}</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <button class="btn" id="h-rejouer">${t("Rejouer 🌿", "Opnieuw spelen 🌿")}</button>
        <button class="btn ghost" id="h-aujardin">${t("Planter mes graines 🌼", "Mijn zaadjes planten 🌼")}</button>
      </div>`;
    zone.appendChild(o);
    $("#h-rejouer").addEventListener("click", renderHerbes);
    $("#h-aujardin").addEventListener("click", () => { userView = "jardin"; render(); });
  }
}

// 🚪 L'ESPACE — porte d'entrée : soit on se connecte, soit on crée sa carte.
// Si on est déjà identifié, on file droit au tableau de bord.
// 🔑 MODALE DE CONNEXION FAMIFORMATION. On se connecte avec ses identifiants du
// site Famiformation (identifiant OU email + mot de passe). Pas de compte ? Un
// lien « inscris-toi » ouvre le module de récolte des mails. Connecté → on arrive
// sur le tableau de bord, comme si on était déjà entré.
function ouvreConnexionFami() {
  if (document.querySelector(".modal-fond")) return;   // pas deux fois
  const o = document.createElement("div");
  o.className = "modal-fond";
  o.innerHTML = `<div class="modal">
    <h2 style="font-family:'Fredoka',sans-serif; color:var(--pousse); font-size:1.5rem; margin:0 0 4px; text-align:center;">${t("Connecte-toi avec tes identifiants Famiformation", "Meld je aan met je Famiformation-gegevens")}</h2>
    <p style="text-align:center; color:#5a6b60; margin:0 0 12px;">${t("Le même compte que sur le site Famiformation.", "Hetzelfde account als op de Famiformation-site.")}</p>
    <div style="background:#eef6ec; border:1px solid #d7e8d2; border-radius:12px; padding:10px 14px; margin:0 0 16px; font-size:.92rem; color:#3f4a41; line-height:1.45;">${t("📩 <b>Tu as déjà donné ton adresse mail ?</b> Tes identifiants t'ont été envoyés par e-mail : regarde ta boîte de réception <b>et tes spams / courriers indésirables</b>.", "📩 <b>Heb je je e-mailadres al doorgegeven?</b> Je gegevens zijn je per e-mail bezorgd: kijk in je inbox <b>en je spam / ongewenste e-mail</b>.")}</div>
    <div id="cf-err"></div>
    <label class="lbl">${t("Identifiant", "Gebruikersnaam")}</label>
    <input class="field" id="cf-id" ${autoComp("username")} placeholder="${t("Identifiant", "Gebruikersnaam")}">
    <label class="lbl">${t("Mot de passe", "Wachtwoord")}</label>
    <div style="position:relative; margin-bottom:14px;">
      <input class="field" id="cf-mdp" type="password" ${autoComp("current-password")} placeholder="${t("Mot de passe", "Wachtwoord")}" style="margin:0; padding-right:48px; width:100%;">
      <button type="button" id="cf-mdp-eye" title="${t("Afficher / masquer le mot de passe", "Wachtwoord tonen / verbergen")}" aria-label="${t("Afficher le mot de passe", "Wachtwoord tonen")}" style="position:absolute; right:6px; top:0; height:100%; display:flex; align-items:center; background:none; border:none; cursor:pointer; font-size:1.3rem; padding:0 8px;">👁️</button>
    </div>
    <button class="btn" id="cf-ok" style="width:100%; margin-top:6px;">${t("Se connecter 🌱", "Aanmelden 🌱")}</button>
    <p style="text-align:center; margin:16px 0 0; line-height:1.5;">${t("Tu n'as pas de compte Famiformation ?", "Heb je nog geen Famiformation-account?")}<br>
      <a href="#" id="cf-inscription" class="lien">${t("Inscris-toi ici", "Schrijf je hier in")}</a> ${t("pour recevoir tes identifiants.", "om je gegevens te ontvangen.")}</p>
    <p class="center" style="margin-top:12px;"><a href="#" id="cf-annuler" class="lien" style="color:#8a988f;">${t("Annuler", "Annuleren")}</a></p>
  </div>`;
  document.body.appendChild(o);
  const ferme = () => o.remove();
  const erreur = (txt) => { o.querySelector("#cf-err").innerHTML = `<div class="alert">${esc(txt)}</div>`; };
  // 👁️ Voir / masquer le mot de passe.
  const cfEye = o.querySelector("#cf-mdp-eye");
  if (cfEye) cfEye.addEventListener("click", () => {
    const inp = o.querySelector("#cf-mdp");
    const montrer = inp.type === "password";
    inp.type = montrer ? "text" : "password";
    cfEye.textContent = montrer ? "🙈" : "👁️";
    inp.focus();
  });

  const go = async () => {
    const id = o.querySelector("#cf-id").value.trim();
    const mdp = o.querySelector("#cf-mdp").value;
    if (!id || !mdp) { erreur(t("Entre ton identifiant (ou e-mail) et ton mot de passe.", "Vul je gebruikersnaam (of e-mail) en je wachtwoord in.")); return; }
    o.querySelector("#cf-ok").disabled = true;
    o.querySelector("#cf-err").innerHTML = "";
    const r = await apiLoginFami(id, mdp);
    o.querySelector("#cf-ok").disabled = false;
    if (!r || !r.ok) {
      const raison = r && r.reason;
      if (raison === "a_activer") { erreur(t("Ton compte n'est pas encore activé : clique sur le lien reçu par e-mail pour choisir ton mot de passe.", "Je account is nog niet geactiveerd: klik op de link in je e-mail om een wachtwoord te kiezen.")); return; }
      if (raison === "base_indisponible") { erreur(t("Le service est momentanément indisponible. Réessaie dans un instant.", "De dienst is even niet beschikbaar. Probeer straks opnieuw.")); return; }
      erreur(t("Identifiant ou mot de passe incorrect.", "Gebruikersnaam of wachtwoord onjuist.")); return;
    }
    // Connecté : on ouvre sa session de jeu et on garde le jeton (téléphone perso).
    const j = r.joueur || {};
    joueur = { name: j.name, code: "", jeton: r.jeton, uid: j.uid, prenom: j.prenom, nom: j.nom, pseudo: j.pseudo || "",
               solde: j.solde || 0, recoltees: j.recoltees || 0, nbCodes: j.nbCodes || 0, quizFait: j.quiz_fait !== false };
    sauveJeton(r.jeton);
    const msg = await reclamerEnAttente();
    jardinMsg = msg || null;
    ferme();
    userView = "dashboard"; quiz = null;
    render();
  };
  o.querySelector("#cf-ok").addEventListener("click", go);
  o.querySelector("#cf-mdp").addEventListener("keydown", (e) => e.key === "Enter" && go());
  o.querySelector("#cf-id").addEventListener("keydown", (e) => e.key === "Enter" && o.querySelector("#cf-mdp").focus());
  o.querySelector("#cf-inscription").addEventListener("click", (e) => { e.preventDefault(); ferme(); userView = "inscription"; render(); });
  o.querySelector("#cf-annuler").addEventListener("click", (e) => { e.preventDefault(); ferme(); });
  o.addEventListener("click", (e) => { if (e.target === o) ferme(); });
  setTimeout(() => o.querySelector("#cf-id").focus(), 50);
}

    const slogan = d.slogan ? `<div class="info-slogan">${d.slogan}</div>` : "";
    // Contenu : soit un « corps » HTML libre (guide e-mail), soit la structure
    // par blocs (cartes/étapes/note/slogan) de la présentation.
    const contenu = d.corps ? d.corps : `${cards}${steps}${note}${slogan}`;
    const sous = d.sous ? `<p class="info-sous">${d.sous}</p>` : "";
    o.innerHTML = `<div class="ext-bar">

        ${sous}
        ${d.intro ? `<p class="info-intro">${d.intro}</p>` : ""}
        ${contenu}
        <button class="info-cta" id="info-cta">${d.cta}</button>
      </div></div>`;
    o.querySelector("#ge-retour").addEventListener("click", () => o.remove());
    o.querySelectorAll("[data-l]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.l)));
    o.querySelector("#info-cta").addEventListener("click", () => { o.remove(); userView = "inscription"; quiz = null; render(); });
  };
  o._redessine = dessine;   // permet au sélecteur global de rafraîchir la page ouverte
  dessine();
  document.body.appendChild(o);
}

// 🧭 TABLEAU DE BORD (une fois connecté) : 3 gros blocs — faire le quiz (verrouillé
// avant le lancement), mon jardin (verrouillé tant que le quiz n'est pas fait),
// voir le classement.
function renderDashboard() {
  clearInterval(tickTimer);
  if (!joueur) { userView = "espace"; render(); return; }
  if (!espaceAccessible()) { retourAccueilVerrou(); return; }   // 🔒 avant le lancement → accueil
  document.body.classList.toggle("mode-borne", ECRAN === "borne");
  const phase = phaseNow();
  const quizOuvert = (phase === "ouvert") || toutOuvert();
  // 🧪 En mode TEST (simulation), on ne verrouille rien : le quiz est rejouable
  // autant de fois qu'on veut et le jardin est toujours ouvert, pour pouvoir TOUT
  // essayer. En vrai, le quiz ne se fait qu'une fois et le jardin s'ouvre après.
  const quizFait = toutOuvert() ? false : !!joueur.quizFait;
  const jardinOk = toutOuvert() ? true : quizFait;
  // 🏆 Vainqueur : quand l'événement est TERMINÉ, si le joueur connecté est dans
  // le top 3 du classement final, on l'en félicite et on l'oriente vers les RH.
  let rangFinal = 0;
  if (phase === "termine" && joueur) {
    const classe = (board || []).filter((p) => p.quiz_fait !== false && !COMPTES_TEST.includes((p.name || "").toLowerCase()))
      .slice().sort((a, b) => (b.score - a.score) || ((a.time || 0) - (b.time || 0)));
    const idx = classe.findIndex((p) => (p.name || "").toLowerCase() === (joueur.name || "").toLowerCase());
    if (idx >= 0 && idx < 3) rangFinal = idx + 1;
  }
  const ordinal = (r) => t(r === 1 ? "1er" : r + "e", r + "e");
  app.innerHTML = `<div class="home">
    <div class="dash-hello">${t("Salut", "Hallo")} <b>${esc(joueur.name)}</b> 🌱 <span>${affG(joueur.recoltees)} ${t("graines récoltées", "zaadjes geoogst")}</span></div>
    ${rangFinal ? `<div class="alert ok" style="max-width:660px;margin:0 auto 16px;background:#fff7e4;border:2px solid #E9A93C;color:#7a4a11;font-weight:600;">
      🏆 ${t("Bravo, tu finis <b>" + ordinal(rangFinal) + "</b> du classement ! Va <b>récupérer ta récompense auprès des RH</b> du magasin (dès le 01/09).", "Proficiat, je eindigt <b>" + ordinal(rangFinal) + "</b> in de ranking! <b>Haal je beloning op bij de HR</b> van de winkel (vanaf 01/09).")}
    </div>` : ""}
    ${jardinMsg ? `<div class="alert" style="max-width:640px;margin:0 auto 16px;">${esc(jardinMsg)}</div>` : ""}
    <div class="borne-modules dash-modules">
      <button class="borne-mod${quizOuvert && !quizFait ? "" : " mod-inactif"}" id="dash-quiz">
        <span class="bm-emo">🎯</span>
        <span class="bm-titre">${t("Faire le quiz", "De quiz doen")}</span>
        <span class="bm-desc">${quizFait ? t("✅ Quiz déjà fait", "✅ Quiz al gedaan") : (quizOuvert ? t("Réponds et récolte tes graines", "Antwoord en oogst je zaadjes") : t("🔒 Dispo le ", "🔒 Beschikbaar op ") + labelLancement())}</span>
      </button>
      <button class="borne-mod${jardinOk ? "" : " mod-inactif"}" id="dash-jardin">
        <span class="bm-emo">🌼</span>
        <span class="bm-titre">${t("Mon espace jardin", "Mijn tuin")}</span>
        <span class="bm-desc">${jardinOk ? t("Plante tes graines — va au bout et gagne une récompense 🌼", "Plant je zaadjes — werk je tuin af en win een beloning 🌼") : t("🔒 Fais le quiz d'abord", "🔒 Doe eerst de quiz")}</span>
      </button>
      <button class="borne-mod" id="dash-board">
        <span class="bm-emo">🏆</span>
        <span class="bm-titre">${t("Voir le classement", "Bekijk de ranking")}</span>
        <span class="bm-desc">${t("Le podium repart avec de très belles récompenses !", "Het podium wint heel mooie prijzen!")}</span>
      </button>
    </div>
    <div class="home-liens">
      <button class="lien-explik" id="dash-explik">${t("✨ Comment ça marche ?", "✨ Hoe werkt het?")}</button>
      <button class="lien-explik" id="dash-code">${t("🎁 J'ai un code", "🎁 Ik heb een code")}</button>
      <button class="lien-explik" id="dash-retour">${t("◂ Accueil", "◂ Beginscherm")}</button>
    </div>
  </div>`;
  $("#dash-quiz").addEventListener("click", () => {
    if (quizFait) { jardinMsg = t("Tu as déjà fait le quiz 🌱 Direction ton jardin !", "Je hebt de quiz al gedaan 🌱 Op naar je tuin!"); userView = "jardin"; ouvreJardinDepuisDash(); return; }
    if (!quizOuvert) { modaleQuizVerrouille(); return; }
    ouvrePseudoPuisQuiz();
  });
  $("#dash-jardin").addEventListener("click", () => {
    if (!jardinOk) { modaleJardinVerrouille(); return; }
    ouvreJardinDepuisDash();
  });
  $("#dash-board").addEventListener("click", () => { userView = "board"; render(); });

  $("#dash-code").addEventListener("click", () => { codeAReclamer = null; userView = "reclamer"; render(); });
  // Quitter son espace vers l'accueil = se déconnecter (sur la borne, le retour
  // recharge déjà une page fraîche, donc « déconnecté » de fait).

// au classement. Par défaut on propose son prénom (ou l'identifiant). Le pseudo
// est purement décoratif : le compte reste rattaché à l'identifiant Famiformation.

  const actuel = (joueur && (joueur.pseudo || joueur.prenom || joueur.name)) || "";
  const o = document.createElement("div");

    <div id="ps-err"></div>
    <input class="field" id="ps-in" maxlength="24" value="${esc(actuel)}" placeholder="${t("Ton pseudo", "Je bijnaam")}">
    <button class="btn" id="ps-ok" style="width:100%; margin-top:8px;">${t("C'est parti ! 🚀", "We gaan ervoor! 🚀")}</button>
    <p class="center" style="margin-top:10px;"><a href="#" id="ps-annuler" class="lien" style="color:#8a988f;">${t("Annuler", "Annuleren")}</a></p>
  </div>`;
  document.body.appendChild(o);

function zonesDispoLe() { return CONFIG.dateLancement.getTime() - 86400000; }   // veille du lancement

function labelMoment(ts) {
  const d = new Date(ts);
  const h = d.getMinutes() ? `${d.getHours()}h${pad(d.getMinutes())}` : `${d.getHours()}h`;
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} à ${h}`;
}

  // pas encore renseignées côté admin), mais verrouillé — au clic on dit quand il

  if (Date.now() < zonesDispoLe()) {

// La librairie QR (~56 Ko) n'est chargée QUE pour l'écran télé — jamais pour
// les joueurs. Le QR encode l'adresse du quiz (sans le ?simulation).
let qrCharge = null, qrCache = null;
function chargeQR() {
  if (window.qrcode) return Promise.resolve();
  if (qrCharge) return qrCharge;
  qrCharge = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "qrcode.js"; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return qrCharge;
}
async function qrQuiz() {
  if (qrCache) return qrCache;
  await chargeQR();
  // 🏬 Le QR de la télé envoie vers le quiz DE CE MAGASIN. En vrai la télé tourne
  // sur /quiz/<site>/tele → on pointe sur /quiz/<site>. En secours (site inconnu),
  // on met l'accueil, qui demandera de choisir le magasin.
  const url = SITE
    ? "https://famiformation.com/quiz/" + SITE
    : "https://famiformation.com/quiz";   // adresse publique des joueurs
  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  qrCache = { svg: qr.createSvgTag(6, 2), url };
  return qrCache;
}

      else {
        c.textContent = "🎉"; clearInterval(it);

/* ============================================================
   📺 ÉCRAN TÉLÉ (/quiz/tele) — pour la télé du magasin.
   AVANT le lancement, il montre EXACTEMENT le compte à rebours de la page joueur
   (avec la fée, la graine qui pousse, tout) — c'est render() qui appelle
   renderCountdown(). APRÈS le lancement, il montre le classement en direct + QR.
   La bascule est gérée par render() selon la phase.
   ============================================================ */
// Badge « il reste N codes à trouver » (affiché au-dessus du QR sur la télé).
function tvCodesBadge(cr) {
  if (!cr || cr.restants == null) return "";
  if (cr.restants <= 0) return `<div class="tv-codes tv-codes-done">✅ Tous les codes ont été trouvés ! · Alle codes gevonden!</div>`;
  return `<div class="tv-codes">🔎 Il reste <b>${cr.restants}</b> code${cr.restants > 1 ? "s" : ""} à trouver&nbsp;! · Nog <b>${cr.restants}</b> code${cr.restants > 1 ? "s" : ""} te vinden!</div>`;
}

async function renderTeleBoard() {
  document.body.classList.add("mode-tele");
  FEE.stop();   // une fois le quiz lancé, la fée range sa baguette
  board = await apiGetBoard().catch(() => board);
  const q = await qrQuiz().catch(() => null);
  const cr = await apiCodesRestants().catch(() => null);
  const top = board.filter((p) => p.quiz_fait !== false && !COMPTES_TEST.includes((p.name || "").toLowerCase())).slice(0, 8);
  const termine = phaseNow() === "termine";
  app.innerHTML = `<div class="tv">
    <div class="tv-phase">${termine ? "🏆 Classement final · Eindklassement" : "🏆 Classement en direct · Live ranking"}</div>
    <div class="tv-cols">
      <div class="tv-board">
        ${top.length ? top.map((p, i) => `<div class="tv-row"><span>${medals[i] || (i + 1) + "."} ${esc(nomAff(p))}</span><span>${affG(p.score)} 🌰</span></div>`).join("")
          : `<div class="tv-row" style="justify-content:center;">Sois le premier à jouer ! 🌱 · Wees de eerste!</div>`}
      </div>
      <div class="tv-qr">
        ${tvCodesBadge(cr)}
        <div class="tv-qr-box">${q ? q.svg : ""}</div>
        <div class="tv-scan">📱 Scanne pour jouer ! · Scan om te spelen!</div>
        <div class="tv-url">${esc(q ? q.url : "")}</div>
      </div>
    </div>
  </div>`;
  // Rafraîchissement auto. À la fin, on ALTERNE avec l'écran des 3 vainqueurs.
  clearInterval(tickTimer); clearTimeout(tickTimer);
  tickTimer = setTimeout(() => {
    const ph = phaseNow();
    if (ph === "avant") render();
    else if (ph === "termine") renderTeleWinners();
    else renderTeleBoard();
  }, 12000);   // classement + codes restants rafraîchis toutes les 12 s
}

// 📺 Télé — ÉCRAN DES 3 VAINQUEURS (fin d'événement) : podium en marches, puis on
// repasse au classement complet (pour que chacun se retrouve). Boucle télé.
async function renderTeleWinners() {
  document.body.classList.add("mode-tele");

// 🏠 ACCUEIL unifié — même écran pour la borne, le téléphone et l'ordi. SEULE
// différence : le téléphone/ordi affichent le compte à rebours en haut tant qu'on
// n'a pas atteint le lancement ; la borne, jamais. À zéro le compte à rebours
// disparaît partout et le module « Participer au quiz » s'active tout seul.
// URL de la MÊME page pour un magasin donné, en gardant l'écran courant
// (/tele, /borne, /code). Sert aux boutons du choix de magasin.
function urlSite(site) {
  let p = location.pathname.replace(/\/+$/, "");
  let suf = "";
  const m = p.match(/\/(tele|borne|code)$/);
  if (m) { suf = m[0]; p = p.slice(0, -suf.length); }
  return location.origin + p + "/" + site + suf + location.search;
}

const URL_EMAILS = "https://famiformation.com/emails/?embed=1";

  // « Page e-mail » recharge la page d'accueil des emails : c'est le retour arrière

  const va = (surForm) => {

  btnForm.addEventListener("click", () => va(true));
  va(false);
}
