<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Famiformation — Récompenses RH</title>
<style>
  :root { --pousse:#1E7A46; --foret:#0E3B24; --brume:#eef4ef; --craie:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--brume); color:var(--foret);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; padding:18px 14px 60px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 2px; color:var(--pousse); }
  .sub { color:#5a6b60; margin:0 0 16px; font-size:.95rem; }
  .card { background:var(--craie); border-radius:16px; padding:18px 18px; margin-bottom:16px;
    box-shadow:0 6px 20px rgba(14,59,36,.08); border:1px solid #e6efe8; }
  .field { width:100%; padding:12px 14px; border:2px solid #cfe0d4; border-radius:12px; font-size:1rem; margin:6px 0 12px; }
  .btn { border:none; cursor:pointer; background:var(--pousse); color:#fff; font-weight:700;
    padding:12px 20px; border-radius:999px; font-size:1rem; }
  .btn.ghost { background:#fff; color:var(--foret); border:2px solid var(--pousse); }
  .btn:disabled { opacity:.5; cursor:default; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .top .spacer { flex:1; }
  .site-switch { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .ss-btn { border:2px solid var(--pousse); background:#fff; color:var(--foret); border-radius:999px;
    padding:8px 16px; font-weight:700; cursor:pointer; }
  .ss-btn.on { background:var(--pousse); color:#fff; }
  .sec-titre { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 10px; }
  .sec-titre h2 { font-size:1.15rem; margin:0; color:var(--foret); }
  .compte { font-size:.9rem; color:#5a6b60; font-weight:700; }
  .rh-row { display:flex; align-items:center; gap:12px; padding:11px 8px; border-top:1px solid #eef2ee; }
  .rh-row:first-of-type { border-top:none; }
  .rh-row.remis { background:#f2faf4; }
  .rh-rang { flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:#eef4ef; color:var(--pousse);
    font-weight:800; display:flex; align-items:center; justify-content:center; font-size:.95rem; }
  .rh-rang.or { background:#F7C13A; color:#5a4300; } .rh-rang.argent { background:#d7dde1; color:#333; }
  .rh-rang.bronze { background:#e6b98a; color:#5a3a17; }
  .rh-info { flex:1; min-width:0; }
  .rh-nom { font-weight:700; }
  .rh-meta { font-size:.85rem; color:#7a8a80; }
  .rh-check { flex:0 0 auto; display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    font-weight:700; color:#5a6b60; font-size:.9rem; }
  .rh-check input { width:26px; height:26px; accent-color:var(--pousse); cursor:pointer; }
  .rh-check.on { color:var(--pousse); }
  .vide { color:#8a988f; padding:10px 4px; font-style:italic; }
  .msg { padding:10px 14px; border-radius:10px; margin-bottom:12px; font-weight:600; }
  .msg.err { background:#fdecec; color:#a12; } .msg.ok { background:#eaf7ec; color:#1E7A46; }
  .hint { color:#7a8a80; font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const API = "../api.php";
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const SITES = { mouscron:"Famiflora Mouscron", lapanne:"Famiflora La Panne" };

let auth = null;
try { auth = JSON.parse(localStorage.getItem("fj_rh_auth") || "null"); } catch (e) {}
let site = localStorage.getItem("fj_rh_site") || "mouscron";
let data = null;

async function post(action, corps = {}) {
  const r = await fetch(`${API}?action=${action}`, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ ...(auth || {}), site, ...corps }),
  });
  let d = null; try { d = await r.json(); } catch { d = null; }
  return { ok:r.ok, status:r.status, data:d };
}

function vueLogin(err) {
  $("#app").innerHTML = `
    <h1>🎁 Récompenses — accès RH</h1>
    <p class="sub">Connecte-toi pour voir qui doit recevoir une récompense.</p>
    <div class="card" style="max-width:420px;">
      ${err ? `<div class="msg err">${esc(err)}</div>` : ""}
      <label>Identifiant</label>
      <input class="field" id="lg-id" autocomplete="username" placeholder="Identifiant">
      <label>Mot de passe</label>
      <input class="field" id="lg-pwd" type="password" autocomplete="current-password" placeholder="Mot de passe">
      <button class="btn" id="lg-ok" style="width:100%;">Se connecter</button>
    </div>`;
  const go = async () => {
    const id = $("#lg-id").value.trim(), pwd = $("#lg-pwd").value;
    if (!id || !pwd) return;
    auth = { id, pwd };
    const r = await post("rh_liste");
    if (r.status === 401) { auth = null; vueLogin("Identifiant ou mot de passe incorrect."); return; }
    if (!r.ok || !r.data || !r.data.ok) { auth = null; vueLogin("Connexion impossible, réessaie."); return; }
    localStorage.setItem("fj_rh_auth", JSON.stringify(auth));
    data = r.data; rendre();
  };
  $("#lg-ok").addEventListener("click", go);
  $("#lg-pwd").addEventListener("keydown", (e) => e.key === "Enter" && go());
}

function nomAffiche(p) {
  const nn = `${p.prenom || ""} ${p.nom || ""}`.trim();
  return nn || p.pseudo || p.name;
}
function ligneHtml(p, type, rangClass) {
  const remis = !!p.remis;
  const rang = type === "podium" ? `<div class="rh-rang ${rangClass}">${p.rang}</div>` : `<div class="rh-rang">🎁</div>`;
  const meta = [];
  if (p.pseudo && p.pseudo !== nomAffiche(p)) meta.push("pseudo : " + esc(p.pseudo));
  meta.push(esc(String(p.score)) + " 🌰");
  if (p.name) meta.push("id : " + esc(p.name));
  return `<div class="rh-row ${remis ? "remis" : ""}" data-name="${esc(p.name)}" data-type="${type}">
    ${rang}
    <div class="rh-info">
      <div class="rh-nom">${esc(nomAffiche(p))}</div>
      <div class="rh-meta">${meta.join(" · ")}</div>
    </div>
    <label class="rh-check ${remis ? "on" : ""}">
      <input type="checkbox" ${remis ? "checked" : ""}>
      <span>${remis ? "Remis ✅" : "À remettre"}</span>
    </label>
  </div>`;
}

function sectionHtml(titre, emoji, liste, type) {
  const nbRemis = liste.filter((p) => p.remis).length;
  const rows = liste.length
    ? liste.map((p, i) => ligneHtml(p, type, type === "podium" ? ["or","argent","bronze"][i] || "" : "")).join("")
    : `<div class="vide">Personne pour l'instant.</div>`;
  return `<div class="card">
    <div class="sec-titre">
      <h2>${emoji} ${titre}</h2>
      <span class="compte">${nbRemis}/${liste.length} remis</span>
    </div>
    ${rows}
  </div>`;
}

function rendre() {
  $("#app").innerHTML = `
    <h1>🎁 Récompenses à remettre</h1>
    <p class="sub">Coche chaque personne <b>quand tu lui as remis sa récompense</b>. Enregistré automatiquement.</p>
    <div class="site-switch">
      <span style="font-weight:700;">🏬 Magasin :</span>
      ${Object.entries(SITES).map(([k,l]) => `<button class="ss-btn ${site===k?"on":""}" data-site="${k}">${l}</button>`).join("")}
    </div>
    <div class="top">
      <button class="btn ghost" id="rafraichir">🔄 Rafraîchir</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="deco">Se déconnecter</button>
    </div>
    <div id="msg"></div>
    ${sectionHtml("Jardin terminé", "🌼", data.jardin || [], "jardin")}
    ${sectionHtml("Podium (top 3)", "🏆", data.podium || [], "podium")}
    <p class="hint">🌼 Jardin terminé = grille pleine + les 3 lotus (bronze, argent, or). 🏆 Podium = les 3 meilleures récoltes.</p>`;

  document.querySelectorAll(".ss-btn").forEach((b) => b.addEventListener("click", async () => {
    if (site === b.dataset.site) return;
    site = b.dataset.site; localStorage.setItem("fj_rh_site", site);
    await charger();
  }));
  $("#rafraichir").addEventListener("click", charger);
  $("#deco").addEventListener("click", () => { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin(); });

  document.querySelectorAll(".rh-row input").forEach((inp) => inp.addEventListener("change", async (e) => {
    const row = e.target.closest(".rh-row");
    const name = row.dataset.name, type = row.dataset.type, remis = e.target.checked;
    e.target.disabled = true;
    const r = await post("rh_cocher", { type, name, remis });
    e.target.disabled = false;
    if (r.status === 401) { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin("Session expirée, reconnecte-toi."); return; }
    if (!r.ok || !r.data || !r.data.ok) { e.target.checked = !remis; $("#msg").innerHTML = `<div class="msg err">Impossible d'enregistrer, réessaie.</div>`; return; }
    // Met à jour l'état local + l'affichage de la ligne, sans tout recharger.
    const liste = (type === "podium" ? data.podium : data.jardin) || [];
    const item = liste.find((p) => p.name === name); if (item) item.remis = remis;
    rendre();
  }));
}

async function charger() {
  const r = await post("rh_liste");
  if (r.status === 401) { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin("Session expirée, reconnecte-toi."); return; }
  if (!r.ok || !r.data || !r.data.ok) { $("#msg") && ($("#msg").innerHTML = `<div class="msg err">Chargement impossible, réessaie.</div>`); return; }
  data = r.data; rendre();
}

if (auth) { charger(); } else { vueLogin(); }
</script>
</body>
</html>
